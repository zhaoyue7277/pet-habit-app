<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  model-viewer {
    width: 100%; height: 100%;
    background-color: transparent;
    --poster-color: transparent;
    --progress-bar-color: transparent;
    --progress-mask: transparent;
  }
</style>
<!--
  ⚠️⚠️ 顺序至关重要，这段必须放在 model-viewer.min.js 之前 ⚠️⚠️

  【为什么】pet_*.glb 用了 KHR_draco_mesh_compression（写在 extensionsRequired
  里，是硬性要求）。model-viewer 的 Draco 解码器**不内嵌**在自己的 bundle 中，
  而是「检测到该扩展 → 立刻按需下载解码器」。

  默认下载地址是 Google CDN：
      https://www.gstatic.com/draco/versioned/decoders/1.5.6/
  而本 App：
    1. 国内网络访问 gstatic.com 基本不通；
    2. Android 端 WebViewAssetLoader 走 https 虚拟域名，release 包还没有
       INTERNET 权限；
  → 解码器取不到 → glb 永远解码失败 → 界面无限转圈（真机现象根源）。

  改为指向随包分发的本地解码器 ./draco/（同目录 assets/3d/draco/），
  全程离线，零外部请求。

  dracoDecoderLocation 是 model-viewer 的**静态属性**，
  必须在自定义元素被定义（即 min.js 执行）之前设置，之后再设无效。
-->
<script>
  self.ModelViewerElement = self.ModelViewerElement || {};
  self.ModelViewerElement.dracoDecoderLocation = './draco/';
  // 预留：若将来改用 KTX2/Basis 纹理压缩，同样需要自托管转码器
  self.ModelViewerElement.ktx2TranscoderLocation = './draco/';
</script>
<script src="./model-viewer.min.js" type="module"></script>
</head>
<body>
<!--
  【v1.3.0】相机改为「纯水平旋转」

  model-viewer 的相机用极坐标描述，camera-orbit 的格式是 `$theta $phi $radius`：
    - theta = 方位角（水平方向，绕 Y 轴）
    - phi   = 极角（**从模型正上方往下量**，所以 90deg 才是水平正视，
              0deg 在头顶、180deg 在脚底）

  需求是「能看正面/侧面/背面，不能看头顶和脚底」，等价于：
    theta 完全放开 + phi 锁死

  所以用 min/max-camera-orbit 把 phi 的上下限都钉在 90deg：
    纵向被钳制 → 无论怎么拖都不能俯视/仰视
    水平方向 ±Infinity → 正面/侧面/背面自由转

  ⚠️ 注意 disable-zoom（禁用缩放）**不能**禁用旋转，解决不了这个问题，
     必须用 min/max-camera-orbit。

  若将来觉得完全锁死显得「僵」，可把 phi 放宽为 75deg~105deg
  （保留极轻微的可动范围，观感更自然，但依然看不到头顶/脚底）。
-->
<model-viewer
  id="mv"
  auto-rotate
  camera-controls
  disable-pan
  camera-orbit="0deg 90deg auto"
  min-camera-orbit="-Infinity 90deg auto"
  max-camera-orbit="Infinity 90deg auto"
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1"
  rotation-per-second="18deg">
</model-viewer>
<script>
  // 与 Flutter 通信：上报模型真实加载状态。
  // Flutter 侧通过 addJavaScriptHandler('petModelState') 接收。
  function report(state, detail) {
    try {
      if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
        window.flutter_inappwebview.callHandler('petModelState', state, detail || '');
      }
    } catch (e) { /* 非 Flutter 环境（浏览器调试）忽略 */ }
  }

  var mv = document.getElementById('mv');
  var _loaded = false;

  // 模型真正解码完成 → 通知 Flutter 结束 loading
  mv.addEventListener('load', function () {
    _loaded = true;
    report('loaded');
  });

  // 解码失败 → 通知 Flutter 展示失败态
  // detail 里带上具体原因（loadfailure / 网络 / 解码），便于真机排查
  mv.addEventListener('error', function (e) {
    var type = (e && e.detail && e.detail.type) || 'unknown';
    var msg = (e && e.detail && e.detail.message) || '';
    report('error', msg ? (type + ': ' + msg) : type);
  });

  // 自检：确认本地 Draco 解码器确实随包分发且在可达位置。
  // 若这一步失败，说明 assets/3d/draco/ 没打进包或路径不对，
  // 模型必然解码失败 —— 提前上报，避免用户干等到超时。
  (function preflight() {
    try {
      var probe = new XMLHttpRequest();
      probe.open('HEAD', './draco/draco_decoder.wasm', true);
      probe.onreadystatechange = function () {
        if (probe.readyState !== 4) return;
        if (probe.status === 0 || probe.status >= 400) {
          report('error', 'draco-missing(HTTP ' + probe.status + ')');
        }
      };
      probe.onerror = function () { report('error', 'draco-missing(net)'); };
      probe.send();
    } catch (e) { /* 探测失败不阻断主流程 */ }
  })();

  // Flutter 调用：设置模型路径（支持重复调用）
  window.setPetModel = function (src) {
    if (!mv) mv = document.getElementById('mv');
    if (!mv) { report('error', 'no-viewer'); return; }
    mv.setAttribute('src', src);
  };

  // ==================== v1.3.0：点击交互 ====================
  //
  // 【为什么要自己判定「点击」】
  // camera-controls 开启后，model-viewer 会接管触摸事件用于拖拽旋转，
  // 普通的 click 事件不可靠（拖完一圈松手也可能被识别为 click）。
  // 若直接把 click 上报给 Flutter，会出现「用户只是转个模型，
  // 宠物却一直说话」的干扰。
  //
  // 【判定规则】按「位移 + 时长」双阈值，两者都小才算点击：
  //   - 手指移动 < 10px（防止拖拽旋转误判）
  //   - 按下到抬起 < 300ms（防止长按误判）
  // 这是移动端区分 tap 与 drag 的标准做法。
  //
  // 【为什么监听在 document 而不是 model-viewer】
  // model-viewer 内部有 Shadow DOM，事件可能被内部元素吞掉；
  // 监听 document 捕获阶段更可靠。同时用 closest 判断点击目标
  // 是否落在 model-viewer 区域内。
  (function initTapDetection() {
    var TAP_MOVE_TOLERANCE = 10;   // px
    var TAP_TIME_LIMIT = 300;      // ms

    var startX = 0, startY = 0, startTime = 0, tracking = false;

    function inViewer(target) {
      if (!target || !target.closest) return false;
      return !!target.closest('model-viewer');
    }

    document.addEventListener('pointerdown', function (e) {
      if (!inViewer(e.target)) return;
      tracking = true;
      startX = e.clientX;
      startY = e.clientY;
      startTime = Date.now();
    }, true);

    document.addEventListener('pointerup', function (e) {
      if (!tracking) return;
      tracking = false;
      if (!inViewer(e.target)) return;

      var dx = Math.abs(e.clientX - startX);
      var dy = Math.abs(e.clientY - startY);
      var dt = Date.now() - startTime;

      // 位移或时长任一超限 → 判定为拖拽/长按，不上报
      if (dx > TAP_MOVE_TOLERANCE || dy > TAP_MOVE_TOLERANCE) return;
      if (dt > TAP_TIME_LIMIT) return;

      report('tapped');
    }, true);

    // 拖拽开始/取消时清掉追踪状态，避免残留导致误判
    document.addEventListener('pointercancel', function () {
      tracking = false;
    }, true);
  })();

  // 兜底：若 15s 内既没 load 也没 error，上报超时
  var guard = setTimeout(function () {
    if (!_loaded) report('error', 'timeout-watchdog');
  }, 15000);
  mv.addEventListener('load', function () { clearTimeout(guard); });
</script>
</body>
</html>
